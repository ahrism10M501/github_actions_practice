name: First #Define Workflow name
on: push # Define events
jobs:
  first-job: # job name, up to you
    runs-on: ubuntu-latest # key name, setting environment
    steps: # Describe Steps
      - name: Print greeting
        run: echo "Hello World! gnllnlnlnlnl"
      - name: Multiple Lines
        run: |
          echo "Line1"
          echo "Line2"
      - name: Print goodbye
        run: echo "Goodbye!"

      - name: Get Code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
            python -m pip install --upgrade pip
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run unit tests
        run: |
          python -m unittest discover -s src/actions1 -p "test_*.py"
